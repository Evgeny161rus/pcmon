; PC Monitor — ESP32-S3 / ES3C28P (2.8", 320x240)
; Сборка: python -m platformio run -t upload --upload-port COM18
;
; build_dir вынесен из OneDrive: GNU ld не умеет писать -Map в путь с
; кириллицей.
[platformio]
src_dir = firmware/src
build_dir = C:/pio/pcmon
default_envs = pcmon

[env:pcmon]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_KCONFIG_IGNORE=1
  -Ifirmware/src
  -Ifirmware/src/fonts
  ; На этой плате USB-C — родной USB ESP32-S3, Serial идёт через CDC
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; LVGL + TinyTTF + HTTP + WebServer
  -DARDUINO_LOOP_STACK_SIZE=24576
lib_deps =
  lvgl/lvgl@~9.5.0
  bblanchon/ArduinoJson@^7.4.2
  lovyan03/LovyanGFX@^1.1.16
