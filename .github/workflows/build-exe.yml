name: Build PC Monitor for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build EXE and portable folder
        shell: cmd
        run: build_exe.bat
      - name: Create checksums
        shell: pwsh
        run: |
          $one = (Get-FileHash dist\PCMonitor.exe -Algorithm SHA256).Hash
          $folder = (Get-FileHash dist\PCMonitor-folder.zip -Algorithm SHA256).Hash
          @("$one  PCMonitor.exe", "$folder  PCMonitor-folder.zip") | Set-Content dist\SHA256.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-Windows
          path: |
            dist/PCMonitor.exe
            dist/PCMonitor-folder.zip
            dist/SHA256.txt
      - name: Update latest download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PC Monitor — последняя сборка Windows
          body: |
            Готовый **PCMonitor.exe** запускается в Windows без установленного Python.

            Если Microsoft Defender подозрительно реагирует на однофайловую сборку, скачайте **PCMonitor-folder.zip**, распакуйте папку целиком и запустите PCMonitor.exe внутри.

            Контрольные суммы — в SHA256.txt. Сборка исходников: ${{ github.sha }}.
          make_latest: true
          overwrite_files: true
          files: |
            dist/PCMonitor.exe
            dist/PCMonitor-folder.zip
            dist/SHA256.txt
