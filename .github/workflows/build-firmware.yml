name: Build combined ESP32-S3 firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/xiaozhi/**'
      - 'firmware/src/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/xiaozhi/**'
      - 'firmware/src/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XiaoZhi + PC Monitor
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          path: firmware/xiaozhi
          esp_idf_version: release-v5.5
          target: esp32s3
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: pcmon-xiaozhi-esp32s3
          path: |
            firmware/xiaozhi/build/*.bin
            firmware/xiaozhi/build/flasher_args.json
            firmware/xiaozhi/build/flash_args

